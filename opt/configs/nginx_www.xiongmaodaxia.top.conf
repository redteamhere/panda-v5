server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.xiongmaodaxia.top *.xiongmaodaxia.top;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/www.xiongmaodaxia.top;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/www.xiongmaodaxia.top.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/www.xiongmaodaxia.top/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/www.xiongmaodaxia.top/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.xiongmaodaxia.top/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-83.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/www.xiongmaodaxia.top.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    
     client_max_body_size 500m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    
     # 错误页

    # 屏蔽扫描
    location ~* ^/(wp-admin|wp-login|wp-content|wordpress|phpmyadmin|adminer) {
        return 444;
    }

    # 私有 PHP 接口
    location ~ ^/private/(profile_api|build_api|inventory_api|login|logout|createacc|create|session_check|cb_custom|cb_store)\.php$ {
        include enable-php-83.conf;
    }

    # 静态资源
    location ~ ^/user/storage/ { expires 7d; try_files $uri =404; }
    location ~ ^/user/ui/ { expires 7d; try_files $uri =404; }
    location ~ ^/user/apps/.*\.apk$ { expires 1d; try_files $uri =404; }
    location ~* ^/user/ { deny all; return 404; }

    # 敏感目录/文件
    location ~* ^/(private|configs|vendor|logs|scripts|deploy|store|node_modules)/ {
        deny all; return 404;
    }
    location ~ /\. { deny all; return 404; }
    location ~* \.(env|ini|log|sql|bak|sh|json|md|yml|xml|key|crt)$ {
        deny all; return 404;
    }

    # API 接口
    location ~ ^/api/(auth|devices|detail|assign|remove|toggle|sync|report|Ping|Error)\.php$ {
        include enable-php-83.conf;
    }
    location ~ ^/api/.*\.php$ { return 404; }

    # WebSocket 反向代理
    location /api/ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8080;
    }

    # 前端 SPA
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # # PHP 兜底
    # location ~ \.php$ {
    #     include enable-php-83.conf;
    # }

    # SSL 证书验证
    location ~ \.well-known {
        allow all;
    }

    # UA 拦截
    if ($http_user_agent ~* (nmap|sqlmap|masscan|zgrab|censys|shodan)) {
        return 444;
    }
    
    location / {
        try_files $uri /download.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-xx.sock;
        include fastcgi_params;
    }
    access_log  /www/wwwlogs/www.xiongmaodaxia.top.log;
    error_log  /www/wwwlogs/www.xiongmaodaxia.top.error.log;
}