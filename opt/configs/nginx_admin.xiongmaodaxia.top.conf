server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name admin.xiongmaodaxia.top;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/admin.xiongmaodaxia.top/dist;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/admin.xiongmaodaxia.top.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/admin.xiongmaodaxia.top/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/admin.xiongmaodaxia.top/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/admin.xiongmaodaxia.top/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-83.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/admin.xiongmaodaxia.top.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    
     # 🟢 增加这行：设置最大允许上传的请求体大小（例如设置为 200MB）
    client_max_body_size 500m;
     # 1. Vue history 路由 — 必须加，否则刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }
    # 代理 /api 到后端服务器
    location  ^~ /api/ {
        proxy_pass https://www.xiongmaodaxia.top/api/;
        proxy_http_version 1.1;
        proxy_set_header Host www.xiongmaodaxia.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
         proxy_set_header Origin "https://www.xiongmaodaxia.top";
        proxy_set_header Referer "https://www.xiongmaodaxia.top/";
        
         # ✅ WebSocket 支持 — 加这三行
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
    # . 代理 /private 到后端服务器（PHP接口）
    location  ^~ /private/ {
        proxy_pass https://www.xiongmaodaxia.top/private/;
        proxy_http_version 1.1;
        proxy_set_header Host www.xiongmaodaxia.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
         proxy_set_header Origin "https://www.xiongmaodaxia.top";
        proxy_set_header Referer "https://www.xiongmaodaxia.top/";
    }
    # 4. 代理 /user（头像等静态资源）
    location  ^~ /user/ {
        proxy_pass https://www.xiongmaodaxia.top/user/;
        proxy_http_version 1.1;
        proxy_set_header Host www.xiongmaodaxia.top;
        proxy_ssl_verify off;
    }
    # 5. 代理 /screens（设备截图）
    location  ^~ /screens/ {
        proxy_pass https://www.xiongmaodaxia.top/screens/;
        proxy_http_version 1.1;
        proxy_set_header Host www.xiongmaodaxia.top;
        proxy_ssl_verify off;
    }

    access_log  /www/wwwlogs/admin.xiongmaodaxia.top.log;
    error_log  /www/wwwlogs/admin.xiongmaodaxia.top.error.log;
}