server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name gangmax.best *.gangmax.best;
    index index.html;
    root /opt/dragon-control/download-pages;
    include /www/server/panel/vhost/nginx/extension/gangmax.best/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/gangmax.best.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/gangmax.best/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/gangmax.best/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    # Download page API
    location /api/download-page {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploaded files (icons, screenshots, apks)
    location /user/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.well-known{
        allow all;
    }

    access_log  /www/wwwlogs/gangmax.best.log;
    error_log  /www/wwwlogs/gangmax.best.error.log;
}